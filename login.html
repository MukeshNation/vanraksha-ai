<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranger Login - VanaRaksha AI</title>
    <!-- Use project's global stylesheet -->
    <link rel="stylesheet" href="/src/styles.css" />
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-deep);
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius);
            padding: 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px rgba(24, 61, 43, 0.1);
        }

        .login-header {
            margin-bottom: 24px;
            text-align: center;
        }

        .login-header h1 {
            font-family: var(--font-display);
            font-size: 28px;
            font-weight: 700;
            color: #20332a;
            margin-bottom: 4px;
        }

        .login-header p {
            font-size: 13px;
            color: #7b6f60;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: rgba(36, 52, 44, 0.7);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--glass-border);
            color: #24342c;
            font-family: var(--font-primary);
            font-size: 14px;
            padding: 10px 12px;
            border-radius: var(--border-radius-sm);
            outline: none;
            transition: border-color var(--transition);
        }

        .form-group input:focus {
            border-color: var(--green-400);
            box-shadow: 0 0 0 3px rgba(110, 159, 114, 0.1);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--green-700), var(--green-600));
            border: 1px solid var(--green-500);
            color: #fff;
            font-family: var(--font-primary);
            font-size: 14px;
            font-weight: 600;
            padding: 12px;
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            margin-top: 8px;
            transition: all var(--transition);
            box-shadow: 0 4px 12px rgba(47, 105, 72, 0.2);
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(47, 105, 72, 0.3);
            background: linear-gradient(135deg, var(--green-600), var(--green-500));
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            color: var(--red-600);
            background: rgba(184, 84, 67, 0.1);
            border: 1px solid rgba(184, 84, 67, 0.2);
            padding: 10px;
            border-radius: var(--border-radius-sm);
            font-size: 13px;
            margin-top: 16px;
            text-align: center;
            display: none;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: var(--green-700);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: color var(--transition);
        }

        .back-link:hover {
            color: var(--green-500);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <h1>Ranger Access</h1>
            <p>Ground Verification Dashboard</p>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="ranger@vanaraksha.in">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" id="submit-btn" class="btn-submit">Login to Field Desk</button>
            <div id="error-message" class="error-message"></div>
        </form>
        <a href="/" class="back-link">← Back to Main Dashboard</a>
    </div>

    <script type="module">
        import { supabase } from '/src/services/supabaseClient.js';

        const form = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submit-btn');
        const errorMessage = document.getElementById('error-message');

        async function checkSession() {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (session) {
                    window.location.href = '/ranger-dashboard.html';
                }
            } catch (error) {
                console.error("Session check error", error);
            }
        }
        checkSession();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Authenticating...';
            errorMessage.style.display = 'none';

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: emailInput.value,
                    password: passwordInput.value,
                });

                if (error) throw error;
                
                window.location.href = '/ranger-dashboard.html';
                
            } catch (error) {
                errorMessage.textContent = error.message || 'Login failed. Please check your credentials.';
                errorMessage.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Login to Field Desk';
            }
        });
    </script>
</body>
</html>
