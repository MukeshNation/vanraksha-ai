<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranger Dashboard - VanaRaksha AI</title>
    <!-- Use project's global stylesheet -->
    <link rel="stylesheet" href="/src/styles.css" />
    


    <style>
        /* 
         * JUDGE'S NOTE: Zone-based "nearest ranger" simplification
         * For Stage 3, alerts are filtered simply by the 'zone_id' that matches the logged-in ranger.
         * In a production environment with hundreds of rangers, an algorithm would dynamically calculate 
         * the nearest available ranger based on real-time live GPS tracking and terrain traversal times. 
         * For this prototype, the zone-based grouping ensures alerts are routed to the relevant sector team.
         */

        .dashboard-container {
            display: grid;
            grid-template-columns: var(--sidebar-w) 1fr;
            flex: 1;
            height: calc(100vh - var(--header-h));
            position: relative;
        }

        .sidebar {
            background: var(--bg-surface);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            z-index: 5;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--glass-border);
            background: var(--bg-card);
        }

        .sidebar-header h2 {
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: 700;
            color: #20332a;
            margin-bottom: 4px;
        }

        .alert-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .alert-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius);
            padding: 14px;
            cursor: pointer;
            transition: all var(--transition);
        }

        .alert-card:hover {
            border-color: rgba(61,204,115,0.3);
            background: var(--bg-card-hover);
            transform: translateY(-2px);
        }

        .alert-card.active {
            background: #dfe8d8;
            border-color: var(--green-400);
            box-shadow: 0 4px 12px rgba(61,204,115,0.15);
        }

        .alert-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .alert-time {
            font-size: 10px;
            color: rgba(36, 52, 44, 0.5);
            font-weight: 500;
        }

        .alert-coords {
            font-size: 12px;
            color: #6d6a61;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        
        .alert-coords strong {
            color: #20332a;
        }

        .btn-view-map {
            width: 100%;
            background: rgba(61,204,115,0.1);
            border: 1px solid rgba(61,204,115,0.25);
            color: var(--green-700);
            font-family: var(--font-primary);
            font-size: 12px;
            font-weight: 600;
            padding: 8px;
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            transition: all var(--transition);
        }

        .alert-card:hover .btn-view-map {
            background: rgba(61,204,115,0.2);
        }

        .map-area {
            position: relative;
            background: #e4dfd2; /* map loading background */
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .action-panel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(24, 61, 43, 0.15);
            border: 1px solid var(--glass-border);
            display: none;
            gap: 10px;
            z-index: 1000;
        }

        .action-panel.visible {
            display: flex;
        }

        .btn-action {
            font-family: var(--font-primary);
            padding: 10px 16px;
            font-weight: 600;
            font-size: 13px;
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            transition: all var(--transition);
        }

        .btn-confirm { 
            background: linear-gradient(135deg, var(--red-600), var(--red-500));
            color: white; 
            border: 1px solid #9f4035; 
            box-shadow: 0 4px 12px rgba(184, 84, 67, 0.3);
        }
        .btn-confirm:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(184, 84, 67, 0.4); }

        .btn-false { 
            background: var(--bg-card); 
            color: var(--green-800); 
            border: 1px solid var(--glass-border); 
        }
        .btn-false:hover { background: var(--bg-card-hover); border-color: rgba(61,204,115,0.3); }

        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: #7b6f60;
        }

        .empty-state svg {
            color: rgba(61,204,115,0.4);
            margin-bottom: 12px;
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            color: #20332a;
            padding: 12px 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 8px 24px rgba(24, 61, 43, 0.15);
            border-left: 4px solid var(--green-500);
            border-top: 1px solid var(--glass-border);
            border-right: 1px solid var(--glass-border);
            border-bottom: 1px solid var(--glass-border);
            animation: slideIn 0.3s ease-out forwards;
            max-width: 350px;
            font-size: 13px;
            font-weight: 500;
        }

        .toast.error { border-left-color: var(--red-500); }
        .toast.success { border-left-color: var(--green-400); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(235, 229, 217, 0.7);
            backdrop-filter: blur(2px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 18px;
            color: var(--green-800);
            display: none;
        }
        .map-status {
            position: absolute; top: 20px; left: 20px; right: 20px;
            background: var(--bg-card); padding: 16px; border-radius: 8px;
            box-shadow: 0 4px 16px rgba(24, 61, 43, .1); z-index: 2;
        }
        .map-status[hidden] { display: none; }
        .dashboard-container { grid-template-columns: 300px minmax(0, 1fr); }
        .dashboard-container > .sidebar { min-height: 0; min-width: 0; display: flex; padding: 14px; overflow-x: hidden; gap: 14px; }
        .ranger-navigation { display: grid; gap: 5px; flex-shrink: 0; }
        .ranger-nav-label { font-size: 10px; letter-spacing: 1.3px; color: #849386; margin: 7px 12px 10px; }
        .ranger-nav-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border: 0; border-radius: 7px; color: #536a5b; background: transparent; text-decoration: none; font-family: var(--font-primary); font-size: 13px; text-align: left; cursor: pointer; }
        .ranger-nav-item span { width: 19px; font-size: 19px; text-align: center; }
        .ranger-nav-item:hover { background: #e0eadf; }
        .ranger-nav-item.selected { color: white; background: #219b73; }
        .ranger-nav-item:focus-visible { outline: 3px solid #74bda2; outline-offset: 2px; }
        .sidebar-header { border-radius: 8px; flex-shrink: 0; }
        .sidebar-header h2 { font-size: 17px; }
        #refresh-alerts { margin: 10px 0; }
        .alert-list { overflow: visible; flex: 1 0 auto; padding: 0; min-width: 0; }
        .empty-state { padding: 24px 14px; background: var(--bg-card); border-radius: 8px; overflow-wrap: anywhere; }
        .empty-state h3 { font-size: 18px; }
        .empty-state p { font-size: 13px; font-weight: 400; }
        #user-email-display { overflow-wrap: anywhere; }
        .map-area { min-width: 0; }
        .empty-state p { margin: 10px 0 16px; line-height: 1.5; }
        @media (max-width: 700px) {
            .dashboard-container { grid-template-columns: 1fr; height: auto; }
            .dashboard-container > .sidebar { display: flex; max-height: 48vh; }
            .map-area { height: 55vh; min-height: 320px; }
            .action-panel { width: 90%; flex-wrap: wrap; bottom: 15px; }
            .header-right { gap: 8px; }
            #user-email-display { max-width: 150px; overflow-wrap: anywhere; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">
            <span class="logo-icon">VR</span>
            <div class="logo-text">
                <span class="logo-name">VanaRaksha</span>
                <span class="logo-tag">Ranger Verification</span>
            </div>
        </div>
        <div class="header-right">
            <span style="font-size: 12px; color: #7b6f60;" id="user-email-display">Loading...</span>
            <button class="nav-btn" id="logout-btn">Logout</button>
        </div>
    </header>

    <div class="dashboard-container">
        <aside class="sidebar" aria-label="Ranger workspace">
            <nav class="ranger-navigation" aria-label="Ranger navigation">
                <p class="ranger-nav-label">RANGER WORKSPACE</p>
                <a class="ranger-nav-item selected" href="#pending-alerts" aria-current="page"><span aria-hidden="true">▤</span>Pending Alerts</a>
                <a class="ranger-nav-item" href="/#geofences"><span aria-hidden="true">⬡</span>Forest Geofences</a>
                <button class="ranger-nav-item" id="notifications-btn"><span aria-hidden="true">♧</span>Enable notifications</button>
                <a class="ranger-nav-item" href="/"><span aria-hidden="true">▦</span>Main Dashboard</a>
            </nav>
            <div class="sidebar-header" id="pending-alerts" tabindex="-1">
                <h2>Pending Alerts <span id="alert-count"></span></h2>
                <p id="sync-status" role="status" style="font-size:12px">Waiting for your zone assignment</p>
                <button id="refresh-alerts" class="btn-view-map" disabled>Refresh alerts</button>
                <div id="zone-display" style="font-size: 11px; color: #7b6f60; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px;"></div>
            </div>
            <div id="alert-list" class="alert-list">
                <div class="empty-state" role="status">Loading your ranger profile…</div>
            </div>
        </aside>

        <div class="map-area">
            <div id="map"></div>
            <div id="map-status" class="map-status" role="status">Loading map…</div>
            
            <div id="action-panel" class="action-panel">
                <button class="btn-action btn-confirm" id="btn-confirm-fire">Confirm Fire (GPS)</button>
                <button class="btn-action btn-false" id="btn-controlled-burn">Controlled Burn</button>
                <button class="btn-action btn-false" id="btn-false-alarm">False Alarm</button>
                <button class="btn-action btn-false" id="btn-no-fire">No Fire</button>
            </div>
            
            <div id="map-loading" class="loading-overlay">Updating map...</div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script type="module">
        import { supabase } from '/src/services/supabaseClient.js';

        import maplibregl from 'maplibre-gl';
        import 'maplibre-gl/dist/maplibre-gl.css';

        // Zone Base Configuration
        const ZONE_BASES = {
            'ZONE_NORTH': [78.5678, 30.1234] 
        };

        let currentUser = null;
        let currentRanger = null;
        let alertsData = [];
        let map = null;
        let selectedAlert = null;
        let mapMarkers = [];
        let routeSourceAdded = false;
        let refreshTimer = null;
        let loadingAlerts = false;
        let knownAlertIds = new Set();
        let initialAlertsLoaded = false;
        const syncStatus = document.getElementById('sync-status');
        const notificationButton = document.getElementById('notifications-btn');
        const refreshButton = document.getElementById('refresh-alerts');
        notificationButton.addEventListener('click', async () => {
            if (!('Notification' in window)) {
                showToast('Browser notifications are not supported here. New alerts still appear in your inbox.');
                return;
            }
            try {
                const permission = await Notification.requestPermission();
                notificationButton.textContent = permission === 'granted' ? 'Notifications enabled' : 'Notifications blocked';
                showToast(permission === 'granted' ? 'Notifications enabled while this dashboard is open.' : 'Allow notifications in browser settings. Inbox alerts remain available.');
            } catch { showToast('Notifications unavailable. Inbox alerts remain available.'); }
        });
        refreshButton.addEventListener('click', () => loadAlerts(true));

        function notifyNewAlerts(alerts) {
            if (!alerts.length) return;
            const message = `${alerts.length} new alert(s) in ${currentRanger.zone_id}.`;
            showToast(message);
            if ('Notification' in window && Notification.permission === 'granted') {
                try { new Notification('VanaRaksha — Ranger Alert', { body: message, tag: 'ranger-alerts' }); }
                catch { /* Inbox and toast remain available. */ }
            }
        }

        function startAlertUpdates() {
            if (refreshTimer) clearInterval(refreshTimer);
            refreshButton.disabled = false;
            refreshTimer = setInterval(() => loadAlerts(true), 15000);
        }
        window.addEventListener('pagehide', () => clearInterval(refreshTimer));
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && currentRanger) loadAlerts(true);
        });

        const alertListEl = document.getElementById('alert-list');
        const userEmailDisplay = document.getElementById('user-email-display');
        const zoneDisplay = document.getElementById('zone-display');
        const logoutBtn = document.getElementById('logout-btn');
        const actionPanel = document.getElementById('action-panel');
        const mapLoading = document.getElementById('map-loading');
        
        const btnConfirmFire = document.getElementById('btn-confirm-fire');
        const btnControlledBurn = document.getElementById('btn-controlled-burn');
        const btnFalseAlarm = document.getElementById('btn-false-alarm');
        const btnNoFire = document.getElementById('btn-no-fire');

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.3s ease-in';
                setTimeout(() => toast.remove(), 300);
            }, 5000);
        }

        function formatTime(isoString) {
            const d = new Date(isoString);
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' ' + d.toLocaleDateString();
        }

        const mapStatus = document.getElementById('map-status');

        function showState(title, message, retry) {
            alertListEl.replaceChildren();
            const state = document.createElement('div');
            state.className = 'empty-state';
            state.setAttribute('role', 'status');
            const heading = document.createElement('h3');
            heading.textContent = title;
            const detail = document.createElement('p');
            detail.textContent = message;
            state.append(heading, detail);
            if (retry) {
                const button = document.createElement('button');
                button.className = 'btn-view-map';
                button.textContent = 'Try again';
                button.addEventListener('click', retry);
                state.append(button);
            }
            alertListEl.append(state);
        }

        function initMap() {
            map = new maplibregl.Map({
                container: 'map',
                // Use a lighter basemap to match the paper theme, Carto Positron or similar
                style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
                center: [78.9629, 20.5937],
                zoom: 4
            });

            const mapTimeout = setTimeout(() => {
                mapStatus.hidden = false;
                mapStatus.textContent = 'Map is taking longer than expected. Check your connection. Alert details remain available in the sidebar.';
            }, 15000);
            map.on('error', () => {
                mapStatus.hidden = false;
                mapStatus.textContent = 'Map could not load. Check your connection. Alert details remain available in the sidebar.';
            });
            map.on('load', () => {
                clearTimeout(mapTimeout);
                mapStatus.hidden = true;
                map.addSource('route', {
                    'type': 'geojson',
                    'data': {
                        'type': 'Feature',
                        'properties': {},
                        'geometry': { 'type': 'LineString', 'coordinates': [] }
                    }
                });
                
                map.addLayer({
                    'id': 'route-line',
                    'type': 'line',
                    'source': 'route',
                    'layout': {
                        'line-join': 'round',
                        'line-cap': 'round'
                    },
                    'paint': {
                        'line-color': '#2f6948',
                        'line-width': 4,
                        'line-dasharray': [2, 2]
                    }
                });
                routeSourceAdded = true;
            });
        }

        async function fetchRoute(startLng, startLat, endLng, endLat) {
            try {
                const url = `https://router.project-osrm.org/route/v1/driving/${startLng},${startLat};${endLng},${endLat}?geometries=geojson`;
                const response = await fetch(url, { signal: AbortSignal.timeout(10000) });
                const data = await response.json();
                
                if (data.code === 'Ok' && data.routes.length > 0) {
                    return data.routes[0].geometry; 
                }
                throw new Error("No route found");
            } catch (err) {
                console.error("Routing error:", err);
                showToast("Could not calculate route to alert.", "error");
                return null;
            }
        }

        async function loadAlerts(background = false) {
            if (loadingAlerts || !currentRanger) return;
            loadingAlerts = true;
            refreshButton.disabled = true;
            if (!background) showState('Loading alerts', 'Checking pending alerts in your zone…');
            try {
                const { data, error } = await supabase
                    .from('alerts')
                    .select('*')
                    .eq('zone_id', currentRanger.zone_id)
                    .eq('status', 'pending')
                    .order('created_at', { ascending: false })
                    .abortSignal(AbortSignal.timeout(15000));

                if (error) throw error;

                const incoming = data || [];
                if (initialAlertsLoaded) notifyNewAlerts(incoming.filter(alert => !knownAlertIds.has(alert.id)));
                incoming.forEach(alert => knownAlertIds.add(alert.id));
                initialAlertsLoaded = true;
                if (selectedAlert && !incoming.some(alert => alert.id === selectedAlert.id)) selectedAlert = null;
                alertsData = incoming.sort((a, b) => {
                    if (a.confidence === 'Medium' && b.confidence === 'Low') return -1;
                    if (a.confidence === 'Low' && b.confidence === 'Medium') return 1;
                    return 0;
                });

                renderAlerts();
                document.getElementById('alert-count').textContent = `(${alertsData.length})`;
                syncStatus.textContent = 'Updated ' + new Date().toLocaleTimeString() + ' · checks every 15 seconds while open';
            } catch (err) {
                console.error(err);
                syncStatus.textContent = 'Sync failed. Displayed alerts may be outdated. Retry or wait for the next check.';
                if (!background || !initialAlertsLoaded) showState('Alerts unavailable', 'Could not load alerts. Check your connection or ask your administrator to check access permissions.', () => loadAlerts());
            } finally {
                loadingAlerts = false;
                refreshButton.disabled = false;
            }
        }

        function renderAlerts() {
            alertListEl.innerHTML = '';
            
            if (!selectedAlert) actionPanel.classList.remove('visible');
            if (alertsData.length === 0) {
                alertListEl.innerHTML = `
                    <div class="empty-state">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                            <polyline points="22 4 12 14.01 9 11.01"></polyline>
                        </svg>
                        <h3 style="font-family: var(--font-display); font-size: 18px; color: #20332a; margin-bottom: 4px;">All Clear</h3>
                        <p style="font-size: 13px;">No active alerts in your zone.</p>
                    </div>
                `;
                actionPanel.classList.remove('visible');
                if (routeSourceAdded && map) {
                    map.getSource('route').setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: [] } });
                }
                mapMarkers.forEach(m => m.remove());
                mapMarkers = [];
                return;
            }

            alertsData.forEach(alert => {
                const card = document.createElement('div');
                card.className = 'alert-card';
                if (selectedAlert && selectedAlert.id === alert.id) {
                    card.classList.add('active');
                }

                const badgeClass = alert.confidence === 'Medium' ? 'badge-warning' : 'badge-info';
                
                card.innerHTML = `
                    <div class="alert-header">
                        <span class="card-badge ${badgeClass}">${alert.confidence} Confidence</span>
                        <span class="alert-time">${formatTime(alert.created_at)}</span>
                    </div>
                    <div class="alert-coords">
                        <strong>Lat:</strong> ${alert.lat.toFixed(5)}<br>
                        <strong>Lng:</strong> ${alert.lng.toFixed(5)}<br>
                        <strong>Radius:</strong> ${alert.radius_m}m
                    </div>
                    <button class="btn-view-map">View Map Route</button>
                `;

                if (alert.message) {
                    const message = document.createElement('p');
                    message.textContent = alert.message;
                    message.style.cssText = 'font-size:13px;line-height:1.5;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere';
                    card.appendChild(message);
                }
                card.addEventListener('click', () => selectAlert(alert, card));
                alertListEl.appendChild(card);
            });
        }

        async function selectAlert(alert, cardElement) {
            selectedAlert = alert;
            renderAlerts(); 

            actionPanel.classList.add('visible');
            if (!map || !routeSourceAdded) {
                showToast('Map is unavailable or still loading. You can review the alert coordinates in the sidebar.');
                return;
            }
            mapLoading.style.display = 'flex';

            mapMarkers.forEach(m => m.remove());
            mapMarkers = [];

            const alertLngLat = [alert.lng, alert.lat];

            const alertMarker = new maplibregl.Marker({ color: '#b85443' })
                .setLngLat(alertLngLat)
                .addTo(map);
            mapMarkers.push(alertMarker);

            map.flyTo({ center: alertLngLat, zoom: 12 });

            const baseCoords = ZONE_BASES[currentRanger.zone_id];
            if (baseCoords && routeSourceAdded) {
                const baseMarker = new maplibregl.Marker({ color: '#2f6948' })
                    .setLngLat(baseCoords)
                    .addTo(map);
                mapMarkers.push(baseMarker);

                const routeGeom = await fetchRoute(baseCoords[0], baseCoords[1], alertLngLat[0], alertLngLat[1]);
                if (routeGeom) {
                    map.getSource('route').setData({
                        type: 'Feature',
                        geometry: routeGeom
                    });
                    
                    const bounds = new maplibregl.LngLatBounds()
                        .extend(baseCoords)
                        .extend(alertLngLat);
                    
                    map.fitBounds(bounds, { padding: 80, maxZoom: 14 });
                }
            }
            
            mapLoading.style.display = 'none';
        }

        async function updateAlertStatus(status, includeGps = false) {
            if (!selectedAlert) return;

            const updatePayload = {
                status: status,
                confirmed_by: currentUser.email,
                confirmed_at: new Date().toISOString()
            };

            try {
                if (includeGps) {
                    showToast("Capturing GPS location...", "info");
                    const pos = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, {
                            enableHighAccuracy: true,
                            timeout: 10000
                        });
                    });
                    updatePayload.confirmed_lat = pos.coords.latitude;
                    updatePayload.confirmed_lng = pos.coords.longitude;
                }

                const { error } = await supabase
                    .from('alerts')
                    .update(updatePayload)
                    .eq('id', selectedAlert.id);

                if (error) throw error;

                showToast(`Alert marked as: ${status}`, "success");
                
                alertsData = alertsData.filter(a => a.id !== selectedAlert.id);
                selectedAlert = null;
                renderAlerts();

            } catch (err) {
                console.error(err);
                if (err.code === 1) { 
                    showToast("GPS access denied. Cannot confirm fire without location.", "error");
                } else {
                    showToast("Failed to update alert: " + err.message, "error");
                }
            }
        }

        btnConfirmFire.addEventListener('click', () => updateAlertStatus('confirmed', true));
        btnFalseAlarm.addEventListener('click', () => updateAlertStatus('false_alarm', false));
        btnControlledBurn.addEventListener('click', () => updateAlertStatus('controlled_burn', false));
        btnNoFire.addEventListener('click', () => updateAlertStatus('no_fire', false));

        async function initialize() {
            showState('Loading ranger profile', 'Checking your zone assignment…');
            try {
                const { data: { session }, error: sessionError } = await supabase.auth.getSession();
                
                if (sessionError || !session) {
                    window.location.href = '/login.html';
                    return;
                }

                currentUser = session.user;
                userEmailDisplay.textContent = currentUser.email;

                if (!map) {
                    try { initMap(); }
                    catch (error) {
                        mapStatus.textContent = 'Map is unavailable in this browser. Alert details remain available in the sidebar.';
                        console.error(error);
                    }
                }

                const { data: rangerData, error: rangerError } = await supabase
                    .from('rangers')
                    .select('*')
                    .eq('email', currentUser.email)
                    .maybeSingle()
                    .abortSignal(AbortSignal.timeout(15000));

                if (rangerError) {
                    throw new Error('Could not load your ranger profile. Check your connection or ask your administrator to check ranger access permissions.');
                }
                if (!rangerData || !rangerData.zone_id) {
                    zoneDisplay.textContent = 'Zone not assigned';
                    showState('Ranger setup required', 'You are signed in, but no accessible ranger profile with a zone assignment was found for ' + currentUser.email + '. Ask your administrator to check your ranger record and zone assignment, then try again.', initialize);
                    return;
                }

                currentRanger = rangerData;
                zoneDisplay.textContent = `Zone: ${currentRanger.zone_id}`;

                await loadAlerts();
                startAlertUpdates();

            } catch (err) {
                console.error(err);
                showState('Dashboard unavailable', err.message || 'Please check your connection and try again.', initialize);
            }
        }

        logoutBtn.addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = '/login.html';
        });

        initialize();
    </script>
</body>
</html>
